<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σκανάρισμα QR Code με Κάμερα</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(to bottom, #9b59b6, #2c3e50); /* Διαβάθμιση από μωβ σε σκούρο μπλε */
            color: #ffffff; /* Λευκό κείμενο για αντίθεση */
        }

        #videoContainer {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            max-width: 100%;
            border: 2px solid #ffffff; /* Λευκό περίγραμμα γύρω από το video */
        }

        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none; /* Για να επιτρέπεται η αλληλεπίδραση με το video */
        }

        #qrLink {
            margin-top: 20px;
            text-align: center;
            font-size: 16px;
        }

        #qrLink a {
            text-decoration: none;
            color: #ffeb3b; /* Κίτρινο για το link για καλύτερη αναγνωσιμότητα */
            font-weight: bold;
        }

        #qrLink a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Σκανάρισμα QR Code με Κάμερα</h1>

    <div id="videoContainer">
        <video id="video" autoplay></video>
        <canvas id="overlayCanvas"></canvas>
    </div>
    
    <h2>Διεύθυνση QR Code</h2>
    <div id="qrLink">Δεν έχουν ανιχνευθεί δεδομένα QR code ακόμα.</div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        const video = document.getElementById('video');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const qrLinkDiv = document.getElementById('qrLink');
        const overlayContext = overlayCanvas.getContext('2d');
        let lastQRData = ''; // Αποθήκευση του τελευταίου δεδομένου QR code

        async function getCameraStream() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                const backCamera = videoDevices.find(device => device.label.toLowerCase().includes('back')) || videoDevices[0];
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { deviceId: backCamera.deviceId }
                });

                return stream;
            } catch (err) {
                console.error("Σφάλμα κατά την σύνδεση με την κάμερα:", err);
                alert('Σφάλμα κατά την σύνδεση με την κάμερα.');
            }
        }

        getCameraStream()
            .then(stream => {
                if (stream) {
                    video.srcObject = stream;
                    video.play();
                }
            })
            .catch(err => {
                console.error("Σφάλμα κατά την αρχικοποίηση του βίντεο:", err);
                alert('Σφάλμα κατά την αρχικοποίηση του βίντεο.');
            });

        function updateOverlayCanvas() {
            overlayCanvas.width = video.videoWidth;
            overlayCanvas.height = video.videoHeight;
            overlayContext.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height); // Καθαρίστε προηγούμενα σχέδια
        }

        function detectQRCode() {
            updateOverlayCanvas(); // Ενημερώστε το canvas για να ταιριάζει με το video

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const qrCode = jsQR(imageData.data, canvas.width, canvas.height, {
                inversionAttempts: "dontInvert"
            });

            if (qrCode) {
                const qrData = qrCode.data;
                if (qrData !== lastQRData) { // Ενημερώνει μόνο αν το QR code είναι νέο
                    lastQRData = qrData;
                    qrLinkDiv.innerHTML = `<a href="${qrData}" target="_blank">${qrData}</a>`;
                }
                
                // Σχεδιάστε τις γραμμές γύρω από τον QR code
                overlayContext.beginPath();
                overlayContext.moveTo(qrCode.location.topLeftCorner.x, qrCode.location.topLeftCorner.y);
                overlayContext.lineTo(qrCode.location.topRightCorner.x, qrCode.location.topRightCorner.y);
                overlayContext.lineTo(qrCode.location.bottomRightCorner.x, qrCode.location.bottomRightCorner.y);
                overlayContext.lineTo(qrCode.location.bottomLeftCorner.x, qrCode.location.bottomLeftCorner.y);
                overlayContext.closePath();
                overlayContext.lineWidth = 4;
                overlayContext.strokeStyle = 'red';
                overlayContext.stroke();

                // Σχεδιάστε το κείμενο μέσα στο τετραγωνάκι
                overlayContext.font = '20px Arial';
                overlayContext.fillStyle = 'red';
                overlayContext.textAlign = 'center';
                overlayContext.textBaseline = 'middle';
                const centerX = (qrCode.location.topLeftCorner.x + qrCode.location.bottomRightCorner.x) / 2;
                const centerY = (qrCode.location.topLeftCorner.y + qrCode.location.bottomRightCorner.y) / 2;
                overlayContext.fillText('Ναι, σε βρήκα!!!', centerX, centerY);
            } else {
                if (lastQRData) { // Εμφανίζει το τελευταίο link αν δεν ανιχνεύεται QR code
                    qrLinkDiv.innerHTML = `<a href="${lastQRData}" target="_blank">${lastQRData}</a>`;
                } else {
                    qrLinkDiv.textContent = 'Δεν βρέθηκε QR Code στην εικόνα.';
                }
            }
        }

        // Ελέγχει συνεχώς για QR code
        setInterval(detectQRCode, 500); // Επαναλάβετε κάθε 500ms
    </script>
</body>
</html>
