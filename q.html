<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>…</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #F7F4EE; }
  body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; color: #121316; }
  .box { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 28px; text-align: center; }
  .box h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  .box p { margin: 0; color: #6B6C72; max-width: 34ch; line-height: 1.5; }
  .box a { margin-top: 8px; color: #121316; font-weight: 700; }
  .spin { width: 26px; height: 26px; border: 3px solid #E7E2D8; border-top-color: #C9A46A; border-radius: 50%; animation: s .8s linear infinite; }
  .daily { max-width: 480px; margin: 0 auto; padding: 32px 20px; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
  .daily h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.02em; }
  .daily .today-label { color: #C9A46A; font-weight: 700; font-size: 14px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: .06em; }
  .daily .dish { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid #E7E2D8; }
  .daily .dish:last-child { border-bottom: 0; }
  .daily .dish-photo { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .daily .dish-info { flex: 1; min-width: 0; }
  .daily .dish-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .daily .dish-n { font-weight: 700; font-size: 16px; color: #121316; }
  .daily .dish-p { font-weight: 700; font-size: 15px; color: #C9A46A; white-space: nowrap; }
  .daily .dish-d { margin-top: 3px; font-size: 13.5px; color: #6B6C72; font-family: Georgia, 'Times New Roman', serif; font-style: italic; line-height: 1.4; }
  .daily .closed { color: #6B6C72; font-style: italic; padding: 20px 0; }
  .daily .all-days { margin-top: 28px; border-top: 2px solid #E7E2D8; padding-top: 20px; }
  .daily .all-days h3 { margin: 0 0 16px; font-size: 13px; color: #999; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }
  .daily .other-day { margin-bottom: 18px; }
  .daily .other-day-name { font-weight: 700; font-size: 14px; color: #C9A46A; margin-bottom: 6px; }
  .daily .other-dish { display: flex; justify-content: space-between; padding: 3px 0; font-size: 14px; color: #444; }
  .daily .other-dish-p { color: #999; }
  .daily footer { margin-top: 28px; text-align: center; font-size: 12px; color: #999; }
  .offers { max-width: 480px; margin: 0 auto; padding: 32px 20px; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
  .offers h1 { margin: 0 0 20px; font-size: 22px; letter-spacing: -0.02em; }
  .offer { border: 1px solid #E7E2D8; border-radius: 14px; overflow: hidden; margin-bottom: 18px; }
  .offer-img { width: 100%; height: 160px; object-fit: cover; display: block; }
  .offer-body { padding: 16px; }
  .offer-t { font-size: 18px; font-weight: 700; color: #121316; margin: 0 0 6px; }
  .offer-d { font-size: 14px; color: #6B6C72; font-family: Georgia, serif; font-style: italic; line-height: 1.5; margin: 0 0 12px; }
  .offer-prices { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .offer-old { font-size: 15px; color: #999; text-decoration: line-through; }
  .offer-new { font-size: 24px; font-weight: 800; color: #C9A46A; }
  .offer-badge { display: inline-block; background: #C9A46A; color: #fff; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; margin-left: 6px; }
  .offer-countdown { background: #FFF6E8; border: 1px solid #F0DCB8; border-radius: 8px; padding: 10px 12px; font-size: 13px; font-weight: 700; color: #8A6A2E; margin-bottom: 12px; text-align: center; }
  .offer-countdown.soon { background: #FFEBEB; border-color: #F5C2C2; color: #B22; }
  .offer-coupon { display: flex; align-items: center; gap: 8px; background: #F7F4EE; border: 1px dashed #C9A46A; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .offer-coupon code { flex: 1; font-size: 16px; font-weight: 800; letter-spacing: .1em; color: #121316; }
  .offer-coupon button { background: #121316; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .offer-cta { display: block; background: #121316; color: #fff; text-align: center; padding: 12px; border-radius: 10px; font-weight: 700; text-decoration: none; margin-bottom: 10px; }
  .offer-tc { font-size: 11px; color: #999; line-height: 1.4; }
  .offers-empty { text-align: center; color: #6B6C72; font-style: italic; padding: 40px 0; }
  .offers footer { margin-top: 28px; text-align: center; font-size: 12px; color: #999; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div class="box" id="box"><div class="spin" aria-label="…"></div></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc, updateDoc, setDoc, increment } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-lite.js';
import { firebaseConfig, SITE, TEST_SCANS, premiumState } from '/firebase-config.js';
import { hrefFor } from '/profile-render.js';

const db = getFirestore(initializeApp(firebaseConfig));
const el = lang => (navigator.language || 'el').toLowerCase().startsWith('el');
const EL = el();
const T = EL ? {
  missing: ['Αυτό το QR δεν υπάρχει', 'Ίσως ο σύνδεσμος είναι λάθος ή το QR έχει διαγραφεί.'],
  paused: ['Το QR είναι προσωρινά ανενεργό', 'Ο ιδιοκτήτης του το έχει βάλει σε παύση. Δοκίμασε ξανά αργότερα.'],
  draft: ['Αυτό το QR δεν έχει ενεργοποιηθεί ακόμα', 'Ο ιδιοκτήτης του το ετοιμάζει. Δοκίμασε ξανά σε λίγο.'],
  home: 'Φτιάξε κι εσύ QR code'
} : {
  missing: ['This QR code does not exist', 'The link may be wrong, or the QR code was deleted.'],
  paused: ['This QR code is paused', 'Its owner has paused it for now. Please try again later.'],
  draft: ['This QR code is not active yet', 'Its owner is still setting it up. Please try again soon.'],
  home: 'Make your own QR code'
};
document.documentElement.lang = EL ? 'el' : 'en';

const DAYS_EL = ['Κυριακή', 'Δευτέρα', 'Τρίτη', 'Τετάρτη', 'Πέμπτη', 'Παρασκευή', 'Σάββατο'];
const DAYS_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];

function renderDaily(data) {
  const todayNum = new Date().getDay();
  const dayNames = EL ? DAYS_EL : DAYS_EN;
  const todayDishes = data.days && data.days[String(todayNum)];
  const b = document.getElementById('box');
  b.className = 'daily';

  let html = '<h1>' + esc(data.title || (EL ? 'Μενού Ημέρας' : 'Daily Menu')) + '</h1>';
  html += '<div class="today-label">' + dayNames[todayNum] + '</div>';

  if (Array.isArray(todayDishes) && todayDishes.length) {
    todayDishes.forEach(dish => {
      html += '<div class="dish">';
      if (dish.img) html += '<img class="dish-photo" src="' + esc(dish.img) + '" alt="">';
      html += '<div class="dish-info"><div class="dish-top"><span class="dish-n">' + esc(dish.n) + '</span>';
      if (dish.p) html += '<span class="dish-p">' + esc(dish.p) + ' €</span>';
      html += '</div>';
      if (dish.d) html += '<div class="dish-d">' + esc(dish.d) + '</div>';
      html += '</div></div>';
    });
  } else if (typeof todayDishes === 'string') {
    html += '<div class="dish"><div class="dish-info"><div class="dish-d">' + esc(todayDishes) + '</div></div></div>';
  } else {
    html += '<div class="closed">' + (EL ? 'Δεν υπάρχει μενού για σήμερα' : 'No menu for today') + '</div>';
  }

  const otherDays = DAY_ORDER.filter(d => d !== todayNum && data.days && data.days[String(d)]);
  if (otherDays.length) {
    html += '<div class="all-days"><h3>' + (EL ? 'Υπόλοιπη εβδομάδα' : 'Rest of the week') + '</h3>';
    otherDays.forEach(d => {
      const dishes = data.days[String(d)];
      html += '<div class="other-day"><div class="other-day-name">' + dayNames[d] + '</div>';
      if (Array.isArray(dishes)) {
        dishes.forEach(dish => {
          html += '<div class="other-dish"><span>' + esc(dish.n) + '</span>';
          if (dish.p) html += '<span class="other-dish-p">' + esc(dish.p) + ' €</span>';
          html += '</div>';
        });
      } else { html += '<div class="other-dish"><span>' + esc(dishes) + '</span></div>'; }
      html += '</div>';
    });
    html += '</div>';
  }

  html += '<footer>Powered by <a href="' + SITE + '" style="color:#C9A46A">AR Akron QR</a></footer>';
  b.innerHTML = html;
  document.title = data.title || 'Daily Menu';
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderOffers(data) {
  const b = document.getElementById('box');
  b.className = 'offers';
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const all = Array.isArray(data.offers) ? data.offers : [];
  const live = all.filter(o => { if (!o.e) return true; const d = new Date(o.e + 'T23:59:59'); return d >= new Date(); });

  let html = '<h1>' + esc(data.title || (EL ? 'Προσφορές' : 'Offers')) + '</h1>';
  if (!live.length) {
    html += '<div class="offers-empty">' + (EL ? 'Δεν υπάρχουν ενεργές προσφορές αυτή τη στιγμή.' : 'No active offers right now.') + '</div>';
  } else {
    live.forEach(o => {
      html += '<div class="offer">';
      if (o.img) html += '<img class="offer-img" src="' + esc(o.img) + '" alt="">';
      html += '<div class="offer-body">';
      html += '<h2 class="offer-t">' + esc(o.t) + '</h2>';
      if (o.d) html += '<p class="offer-d">' + esc(o.d) + '</p>';
      if (o.np) {
        html += '<div class="offer-prices">';
        if (o.op) html += '<span class="offer-old">' + esc(o.op) + ' €</span>';
        html += '<span class="offer-new">' + esc(o.np) + ' €</span>';
        if (o.op) {
          const oldN = parseFloat(String(o.op).replace(',', '.')), newN = parseFloat(String(o.np).replace(',', '.'));
          if (oldN > 0 && newN >= 0 && newN < oldN) html += '<span class="offer-badge">-' + Math.round((1 - newN / oldN) * 100) + '%</span>';
        }
        html += '</div>';
      }
      if (o.e) {
        const end = new Date(o.e + 'T23:59:59');
        const ms = end - new Date();
        const days = Math.floor(ms / 86400000), hrs = Math.floor((ms % 86400000) / 3600000);
        let txt;
        if (days > 1) txt = (EL ? '⏳ Λήγει σε ' + days + ' μέρες' : '⏳ Ends in ' + days + ' days');
        else if (days === 1) txt = (EL ? '⏳ Λήγει αύριο' : '⏳ Ends tomorrow');
        else txt = (EL ? '🔥 Λήγει σήμερα' + (hrs > 0 ? ' (σε ' + hrs + ' ώρες)' : '') : '🔥 Ends today');
        html += '<div class="offer-countdown' + (days <= 1 ? ' soon' : '') + '">' + txt + '</div>';
      }
      if (o.c) html += '<div class="offer-coupon"><code>' + esc(o.c) + '</code><button type="button" data-copy="' + esc(o.c) + '">' + (EL ? 'Αντιγραφή' : 'Copy') + '</button></div>';
      if (o.u) html += '<a class="offer-cta" href="' + esc(o.u) + '" target="_blank" rel="noopener">' + (EL ? 'Εκμεταλλεύσου την' : 'Get this offer') + '</a>';
      if (o.tc) html += '<div class="offer-tc">' + esc(o.tc) + '</div>';
      html += '</div></div>';
    });
  }
  html += '<footer>Powered by <a href="' + SITE + '" style="color:#C9A46A">AR Akron QR</a></footer>';
  b.innerHTML = html;
  document.title = data.title || 'Offers';
  b.addEventListener('click', e => {
    const btn = e.target.closest('[data-copy]'); if (!btn) return;
    navigator.clipboard.writeText(btn.dataset.copy).then(() => {
      const old = btn.textContent; btn.textContent = '✓'; setTimeout(() => btn.textContent = old, 1500);
    }).catch(() => {});
  });
}

function show(t) {
  const b = document.getElementById('box');
  b.innerHTML = '<h1></h1><p></p><a></a>';
  b.querySelector('h1').textContent = t[0];
  b.querySelector('p').textContent = t[1];
  const a = b.querySelector('a'); a.textContent = T.home; a.href = SITE + '/';
  document.title = t[0];
}
const today = () => new Date().toISOString().slice(0, 10);

async function go() {
  const code = (location.pathname.split('/').filter(Boolean)[1] || new URLSearchParams(location.search).get('c') || '').toLowerCase();
  if (!code) return show(T.missing);
  let q;
  try { const s = await getDoc(doc(db, 'qrs', code)); if (!s.exists()) return show(T.missing); q = s.data(); }
  catch (e) { return show(T.missing); }
  if (q.paused) return show(T.paused);

  let ent = null;
  try { const e = await getDoc(doc(db, 'entitlements', q.ownerUid)); if (e.exists()) ent = e.data(); } catch (e) {}
  const st = premiumState(ent);

  const dest = q.t === 'profile' ? SITE + '/p/' + q.ownerPid : hrefFor({ t: q.t, v: q.v });
  const profile = SITE + '/p/' + q.ownerPid;
  const ref = doc(db, 'qrs', code);
  const count = (field) => Promise.race([
    Promise.all([
      updateDoc(ref, { [field]: increment(1) }),
      field === 'scans' ? setDoc(doc(db, 'qrs', code, 'days', today()), { n: increment(1) }, { merge: true }) : null
    ]).catch(() => {}),
    new Promise(r => setTimeout(r, 3000))  // περιμένουμε να καταγραφεί το σκανάρισμα (συνήθως < 0,5 δευτ.), το πολύ 3 δευτ.
  ]);

  if (st.usable) {                          // Premium ενεργό ή σε περίοδο χάριτος
    // Daily menu micro-page
    if (q.t === 'daily' || q.t === 'offers') {
      await count('scans');
      try {
        const cs = await getDoc(doc(db, 'qrcontent', code));
        if (cs.exists()) return q.t === 'daily' ? renderDaily(cs.data()) : renderOffers(cs.data());
      } catch (e) {}
      return show(T.draft);
    }
    if (!dest) return show(T.draft);
    await count('scans'); return location.replace(dest);
  }
  if (st.ever) {                            // Η συνδρομή έληξε: το QR οδηγεί στο δωρεάν προφίλ
    await count('scans'); return location.replace(profile);
  }
  if ((q.testScans || 0) < TEST_SCANS && dest) {   // Πρόχειρο: δοκιμαστικά σκαναρίσματα
    await count('testScans'); return location.replace(dest);
  }
  show(T.draft);
}
go();
</script>
</body>
</html>
