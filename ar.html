<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Card Generator with QR Code</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <style>
        .vcard-container {
            border: 1px solid #ccc;
            padding: 20px;
            max-width: 400px;
            margin: 20px auto;
            text-align: center;
        }

        .vcard-profile-picture, .vcard-backcover {
            background-size: cover;
            background-position: center;
            width: 100px;
            height: 100px;
            margin: 0 auto 10px;
            border-radius: 50%;
        }

        .vcard-backcover {
            width: 100%;
            height: 150px;
            border-radius: 0;
        }

        #qrcode, #vcard-link, #title {
            display: none;
        }

        /* Hiding the form when the vCard data is available */
        #vcard-form {
            display: block;
        }

        #preview {
            display: none;
        }
    </style>
</head>
<body>
    <h1 id="title">V-Card Generator with QR Code</h1>
    <form id="vcard-form">
        <label>Company Name: <input type="text" id="companyName" required></label><br>
        <label>Email: <input type="email" id="email" required></label><br>
        <label>Address: <input type="text" id="address" required></label><br>
        <label>Phone: <input type="text" id="phone" required></label><br>
        <label>Website: <input type="url" id="website" required></label><br>
        <label>Profile Picture: <input type="file" id="profilePicture" accept="image/*"></label><br>
        <label>Back Cover: <input type="file" id="backCover" accept="image/*"></label><br>
        <button type="button" onclick="generateVCard()">Generate V-Card</button>
    </form>

    <div id="preview" style="display: none;"></div>
    <div id="qrcode" style="display: none;"></div>
    <div id="vcard-link" style="display: none;"></div>

    <script>
        const GITHUB_API_URL = "https://api.github.com/repos/ARISALAB/qrarakro/contents/uploads/";
        const GITHUB_TOKEN = "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";
    
        async function uploadToGitHub(file, fileName) {
            const reader = new FileReader();
            return new Promise((resolve, reject) => {
                reader.onload = async (event) => {
                    const base64Image = event.target.result.split(',')[1];
                    const response = await fetch(`${GITHUB_API_URL}${fileName}`, {
                        method: "PUT",
                        headers: {
                            Authorization: `Bearer ${GITHUB_TOKEN}`,
                            Accept: "application/vnd.github.v3+json",
                        },
                        body: JSON.stringify({
                            message: `Uploaded ${fileName}`,
                            content: base64Image,
                        }),
                    });
    
                    if (response.ok) {
                        const result = await response.json();
                        resolve(result.content.download_url);
                    } else {
                        const error = await response.json();
                        reject(error);
                    }
                };
    
                reader.onerror = () => reject("Error reading file");
                reader.readAsDataURL(file);
            });
        }
    
        async function generateVCard() {
            const companyName = document.getElementById('companyName').value;
            const email = document.getElementById('email').value;
            const address = document.getElementById('address').value;
            const phone = document.getElementById('phone').value;
            const website = document.getElementById('website').value;
    
            const profilePictureFile = document.getElementById('profilePicture').files[0];
            const backCoverFile = document.getElementById('backCover').files[0];
    
            if (!companyName || !email || !address || !phone || !website || !profilePictureFile || !backCoverFile) {
                alert("Please fill all fields and upload images.");
                return;
            }
    
            try {
                // Upload images to GitHub
                const profilePictureURL = await uploadToGitHub(profilePictureFile, `profile_${Date.now()}.jpg`);
                const backCoverURL = await uploadToGitHub(backCoverFile, `backcover_${Date.now()}.jpg`);
    
                // Generate V-Card preview
                const vCardData = { companyName, email, address, phone, website, profilePictureURL, backCoverURL };
                const vCardURL = `${window.location.origin}${window.location.pathname}?data=${encodeURIComponent(JSON.stringify(vCardData))}`;
    
                // Display V-Card link
                const vCardLinkContainer = document.getElementById('vcard-link');
                vCardLinkContainer.style.display = 'block';
                vCardLinkContainer.innerHTML = `<p>Share your V-Card: <a href="${vCardURL}" target="_blank">V-Card Link</a></p>`;
    
                // Generate QR code for V-Card link
                const qrCodeContainer = document.getElementById('qrcode');
                qrCodeContainer.style.display = 'block';
                qrCodeContainer.innerHTML = ""; // Clear previous QR code
                const qrCanvas = document.createElement('canvas');
                qrCodeContainer.appendChild(qrCanvas); // Append canvas to container
    
                QRCode.toCanvas(qrCanvas, vCardURL, { width: 200, margin: 2 }, (error) => {
                    if (error) console.error("Error generating QR Code:", error);
                });
    
                // Hide the form and show the V-Card preview
                const form = document.getElementById('vcard-form');
                form.style.display = 'none';
                const preview = document.getElementById('preview');
                preview.style.display = 'block';
                preview.innerHTML = `
                    <div class="vcard-container">
                        <div class="vcard-backcover" style="background-image: url('${backCoverURL}')"></div>
                        <div class="vcard-profile-picture" style="background-image: url('${profilePictureURL}')"></div>
                        <div class="vcard-content">
                            <h2>${companyName}</h2>
                            <p><strong>Email:</strong> ${email}</p>
                            <p><strong>Address:</strong> ${address}</p>
                            <p><strong>Phone:</strong> ${phone}</p>
                            <p><strong>Website:</strong> <a href="${website}" target="_blank">${website}</a></p>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error("Error generating V-Card:", error);
                alert("Failed to generate V-Card. Check console for details.");
            }
        }
    
        // Parse data from URL on page load
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const data = params.get('data');
            const title = document.getElementById('title');
            if (data) {
                // Hide title, form, and QR code if on the V-Card page
                title.style.display = 'none';
                const form = document.getElementById('vcard-form');
                form.style.display = 'none';
                const qrCodeContainer = document.getElementById('qrcode');
                qrCodeContainer.style.display = 'none';
                const preview = document.getElementById('preview');
                preview.style.display = 'block';
                
                const vCardData = JSON.parse(decodeURIComponent(data));
                const { companyName, email, address, phone, website, profilePictureURL, backCoverURL } = vCardData;

                preview.innerHTML = `
                    <div class="vcard-container">
                        <div class="vcard-backcover" style="background-image: url('${backCoverURL}')"></div>
                        <div class="vcard-profile-picture" style="background-image: url('${profilePictureURL}')"></div>
                        <div class="vcard-content">
                            <h2>${companyName}</h2>
                            <p><strong>Email:</strong> ${email}</p>
                            <p><strong>Address:</strong> ${address}</p>
                            <p><strong>Phone:</strong> ${phone}</p>
                            <p><strong>Website:</strong> <a href="${website}" target="_blank">${website}</a></p>
                        </div>
                    </div>
                `;
            } else {
                // Show the title only when it's the main page
                title.style.display = 'block';
            }
        };
    </script>
</body>
</html>
