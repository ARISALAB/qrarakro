<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Card Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="email"], input[type="file"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .button {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .button:hover {
            background-color: #218838;
        }
        .preview {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #qrcode {
            margin-top: 20px;
        }
        .image-preview {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body>
    <h1>V-Card Generator</h1>
    <div id="vcard-form">
        <div class="form-group">
            <label for="companyName">Company Name</label>
            <input type="text" id="companyName" placeholder="Enter company name">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter email">
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter address">
        </div>
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="Enter phone number">
        </div>
        <div class="form-group">
            <label for="website">Website</label>
            <input type="text" id="website" placeholder="Enter website URL">
        </div>
        <div class="form-group">
            <label for="profilePicture">Profile Picture</label>
            <input type="file" id="profilePicture" accept="image/*">
        </div>
        <div class="form-group">
            <label for="backCover">Back Cover</label>
            <input type="file" id="backCover" accept="image/*">
        </div>
        <button class="button" onclick="generateVCardURL()">Preview & Generate URL</button>
    </div>

    <div id="preview" class="preview" style="display: none;"></div>
    <div id="qrcode" style="display: none;"></div>

    <script>
        let profilePictureBase64 = "";
        let backCoverBase64 = "";

        document.getElementById('profilePicture').addEventListener('change', function (event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function () {
                profilePictureBase64 = reader.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('backCover').addEventListener('change', function (event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function () {
                backCoverBase64 = reader.result;
            };
            reader.readAsDataURL(file);
        });

        function generateVCardURL() {
            // Get form values
            const companyName = document.getElementById('companyName').value;
            const email = document.getElementById('email').value;
            const address = document.getElementById('address').value;
            const phone = document.getElementById('phone').value;
            const website = document.getElementById('website').value;

            // Validate inputs
            if (!companyName || !email || !address || !phone || !website) {
                alert('Please fill in all fields.');
                return;
            }

            // Create URL parameters
            const params = new URLSearchParams({
                companyName,
                email,
                address,
                phone,
                website,
                profilePicture: profilePictureBase64,
                backCover: backCoverBase64
            }).toString();

            const vCardURL = `${window.location.origin}${window.location.pathname}?${params}`;

            // Display preview and link
            const preview = document.getElementById('preview');
            preview.style.display = 'block';
            preview.innerHTML = `
                <h2>V-Card Preview</h2>
                <p><strong>Company Name:</strong> ${companyName}</p>
                <p><strong>Email:</strong> ${email}</p>
                <p><strong>Address:</strong> ${address}</p>
                <p><strong>Phone:</strong> ${phone}</p>
                <p><strong>Website:</strong> ${website}</p>
                <p><strong>Profile Picture:</strong></p>
                <img src="${profilePictureBase64}" alt="Profile Picture" class="image-preview">
                <p><strong>Back Cover:</strong></p>
                <img src="${backCoverBase64}" alt="Back Cover" class="image-preview">
                <p><a href="${vCardURL}" target="_blank">Shareable V-Card Link</a></p>
            `;

            // Generate QR Code
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.style.display = 'block';
            qrcodeDiv.innerHTML = '<h2>QR Code</h2>';
            QRCode.toCanvas(document.createElement('canvas'), vCardURL, function (error, canvas) {
                if (error) console.error(error);
                qrcodeDiv.appendChild(canvas);
            });
        }

        // If URL has parameters, display the V-Card
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            if (params.toString()) {
                const companyName = params.get('companyName');
                const email = params.get('email');
                const address = params.get('address');
                const phone = params.get('phone');
                const website = params.get('website');
                const profilePicture = params.get('profilePicture');
                const backCover = params.get('backCover');

                const preview = document.getElementById('preview');
                preview.style.display = 'block';
                preview.innerHTML = `
                    <h2>V-Card</h2>
                    <p><strong>Company Name:</strong> ${companyName}</p>
                    <p><strong>Email:</strong> ${email}</p>
                    <p><strong>Address:</strong> ${address}</p>
                    <p><strong>Phone:</strong> ${phone}</p>
                    <p><strong>Website:</strong> ${website}</p>
                    <p><strong>Profile Picture:</strong></p>
                    <img src="${profilePicture}" alt="Profile Picture" class="image-preview">
                    <p><strong>Back Cover:</strong></p>
                    <img src="${backCover}" alt="Back Cover" class="image-preview">
                `;

                document.getElementById('vcard-form').style.display = 'none';
            }
        };
    </script>
</body>
</html>
