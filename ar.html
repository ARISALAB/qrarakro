<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vCard Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            font-weight: bold;
        }
        input, button {
            margin-top: 5px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #qr-code {
            margin-top: 20px;
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>vCard Generator</h1>
        <form id="vcard-form">
            <label for="company">Company Name:</label>
            <input type="text" id="company" name="company" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="website">Website:</label>
            <input type="url" id="website" name="website">

            <label for="logo">Upload Logo:</label>
            <input type="file" id="logo" accept="image/*">

            <label for="profile">Upload Profile Picture:</label>
            <input type="file" id="profile" accept="image/*">

            <button type="button" id="generate-button">Generate vCard</button>
        </form>

        <div id="qr-code"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
      document.getElementById('generate-button').addEventListener('click', () => {
    const company = document.getElementById('company').value;
    const email = document.getElementById('email').value;
    const address = document.getElementById('address').value;
    const phone = document.getElementById('phone').value;
    const website = document.getElementById('website').value;

    if (!company || !email || !address || !phone) {
        alert('Please fill in all required fields.');
        return;
    }

    const vCardData = `BEGIN:VCARD\nVERSION:3.0\nFN:${company}\nEMAIL:${email}\nTEL:${phone}\nADR:${address}\nURL:${website}\nEND:VCARD`;

    if (vCardData.length > 1576) {
        alert('The data exceeds the maximum length for a QR Code. Please shorten your input.');
        return;
    }

    const qrCodeContainer = document.getElementById('qr-code');
    qrCodeContainer.innerHTML = '';

    new QRCode(qrCodeContainer, {
        text: vCardData,
        width: 200,
        height: 200,
        correctLevel: QRCode.CorrectLevel.H // Higher error correction level
    });
});

    </script>
</body>
</html>
