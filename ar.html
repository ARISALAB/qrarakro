<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Card Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="email"], input[type="file"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .button {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .button:hover {
            background-color: #218838;
        }
        .preview {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #qrcode {
            margin-top: 20px;
        }
        .image-preview {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
        }
    </style>
    <style>
        .vcard-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            text-align: center;
            color: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .vcard-backcover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }
        .vcard-profile-picture {
            position: relative;
            margin-top: 75px; /* Center relative to backcover */
            width: 100px;
            height: 100px;
            border: 3px solid #fff;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            z-index: 2;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .vcard-content {
            position: relative;
            z-index: 3;
            background: #fff;
            color: #000;
            padding: 20px;
            border-top: 1px solid #ccc;
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body>
    <h1>V-Card Generator</h1>
    <div id="vcard-form">
        <div class="form-group">
            <label for="companyName">Company Name</label>
            <input type="text" id="companyName" placeholder="Enter company name">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter email">
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter address">
        </div>
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="Enter phone number">
        </div>
        <div class="form-group">
            <label for="website">Website</label>
            <input type="text" id="website" placeholder="Enter website URL">
        </div>
        <div class="form-group">
            <label for="profilePicture">Profile Picture</label>
            <input type="file" id="profilePicture" accept="image/*">
        </div>
        <div class="form-group">
            <label for="backCover">Back Cover</label>
            <input type="file" id="backCover" accept="image/*">
        </div>
        <button class="button" onclick="generateVCardURL()">Preview & Generate URL</button>
    </div>

    <div id="preview" class="preview" style="display: none;"></div>
    <div id="qrcode" style="display: none;"></div>

    <script>
        let profilePictureBase64 = "";
        let backCoverBase64 = "";
    
        // Χρησιμοποίηση GitHub URL για εμφάνιση εικόνας
        const githubBaseURL = "https://raw.githubusercontent.com/ARISALAB/qrarakro/main/uploads/";
    
        document.getElementById('profilePicture').addEventListener('change', function (event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function () {
                // Χρησιμοποίησε το URL του GitHub για να αποθηκεύσεις το URL της εικόνας
                profilePictureBase64 = githubBaseURL + file.name;
            };
            reader.readAsDataURL(file);
        });
    
        document.getElementById('backCover').addEventListener('change', function (event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function () {
                // Χρησιμοποίησε το URL του GitHub για να αποθηκεύσεις το URL της εικόνας
                backCoverBase64 = githubBaseURL + file.name;
            };
            reader.readAsDataURL(file);
        });
    
        function generateVCardURL() {
            // Πάρε τις τιμές από τη φόρμα
            const companyName = document.getElementById('companyName').value;
            const email = document.getElementById('email').value;
            const address = document.getElementById('address').value;
            const phone = document.getElementById('phone').value;
            const website = document.getElementById('website').value;
    
            // Έλεγχος εγκυρότητας εισόδων
            if (!companyName || !email || !address || !phone || !website) {
                alert('Please fill in all fields.');
                return;
            }
    
            // Δημιουργία αντικειμένου vCard (χωρίς τις εικόνες)
            const vCardData = {
                companyName,
                email,
                address,
                phone,
                website,
            };
    
            // Αποθήκευση των εικόνων στο sessionStorage
            sessionStorage.setItem('profilePictureBase64', profilePictureBase64);
            sessionStorage.setItem('backCoverBase64', backCoverBase64);
    
            // Δημιουργία URL για το shareable vCard
            const vCardURL = `${window.location.origin}${window.location.pathname}?data=${encodeURIComponent(JSON.stringify(vCardData))}`;
    
            // Προεπισκόπηση
            const preview = document.getElementById('preview');
            preview.style.display = 'block';
            preview.innerHTML = `
                <div class="vcard-container">
                    <div class="vcard-backcover" style="background-image: url('${backCoverBase64}')"></div>
                    <div class="vcard-profile-picture" style="background-image: url('${profilePictureBase64}')"></div>
                    <div class="vcard-content">
                        <h2>${companyName}</h2>
                        <p><strong>Email:</strong> ${email}</p>
                        <p><strong>Address:</strong> ${address}</p>
                        <p><strong>Phone:</strong> ${phone}</p>
                        <p><strong>Website:</strong> <a href="${website}" target="_blank">${website}</a></p>
                    </div>
                </div>
                <p><a href="${vCardURL}" target="_blank">Shareable V-Card Link</a></p>
            `;
    
            // Δημιουργία QR Code (μόνο με το URL)
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.style.display = 'block';
            qrcodeDiv.innerHTML = '<h2>QR Code</h2>';
            QRCode.toCanvas(vCardURL, { errorCorrectionLevel: 'H' }, function (error, canvas) {
                if (error) {
                    console.error(error);
                    alert('Failed to generate QR code. The data might be too large.');
                    qrcodeDiv.innerHTML += '<p style="color: red;">QR Code generation failed. Try reducing the amount of data.</p>';
                    return;
                }
                qrcodeDiv.appendChild(canvas);
            });
        }
    
        // Κατά την φόρτωση της σελίδας, αν υπάρχει δεδομένα στο URL, εμφάνιση της vCard
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const data = params.get('data');
            if (data) {
                const vCardData = JSON.parse(decodeURIComponent(data));
                const { companyName, email, address, phone, website } = vCardData;
    
                // Ανάκτηση εικόνων από το sessionStorage
                const profilePictureBase64 = sessionStorage.getItem('profilePictureBase64') || '';
                const backCoverBase64 = sessionStorage.getItem('backCoverBase64') || '';
    
                const preview = document.getElementById('preview');
                preview.style.display = 'block';
                preview.innerHTML = `
                    <div class="vcard-container">
                        <div class="vcard-backcover" style="background-image: url('${backCoverBase64}')"></div>
                        <div class="vcard-profile-picture" style="background-image: url('${profilePictureBase64}')"></div>
                        <div class="vcard-content">
                            <h2>${companyName}</h2>
                            <p><strong>Email:</strong> ${email}</p>
                            <p><strong>Address:</strong> ${address}</p>
                            <p><strong>Phone:</strong> ${phone}</p>
                            <p><strong>Website:</strong> <a href="${website}" target="_blank">${website}</a></p>
                        </div>
                    </div>
                `;
    
                document.getElementById('vcard-form').style.display = 'none';
            }
        };
    </script>
    
    
</body>
</html>
