<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Card Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="email"], input[type="file"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .button {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .button:hover {
            background-color: #218838;
        }
        .preview {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #qrcode {
            margin-top: 20px;
        }
        .image-preview {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
        }
    </style>
    <style>
        .vcard-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            text-align: center;
            color: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .vcard-backcover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }
        .vcard-profile-picture {
            position: relative;
            margin-top: 75px; /* Center relative to backcover */
            width: 100px;
            height: 100px;
            border: 3px solid #fff;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            z-index: 2;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .vcard-content {
            position: relative;
            z-index: 3;
            background: #fff;
            color: #000;
            padding: 20px;
            border-top: 1px solid #ccc;
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body>
    <h1>V-Card Generator</h1>
    <div id="vcard-form">
        <div class="form-group">
            <label for="companyName">Company Name</label>
            <input type="text" id="companyName" placeholder="Enter company name">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter email">
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter address">
        </div>
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="Enter phone number">
        </div>
        <div class="form-group">
            <label for="website">Website</label>
            <input type="text" id="website" placeholder="Enter website URL">
        </div>
        <div class="form-group">
            <label for="profilePicture">Profile Picture</label>
            <input type="file" id="profilePicture" accept="image/*">
        </div>
        <div class="form-group">
            <label for="backCover">Back Cover</label>
            <input type="file" id="backCover" accept="image/*">
        </div>
        <button class="button" onclick="generateVCardURL()">Preview & Generate URL</button>
    </div>

    <div id="preview" class="preview" style="display: none;"></div>
    <div id="qrcode" style="display: none;"></div>

    <script>
     
    const GITHUB_API_URL = "https://api.github.com/repos/ARISALAB/qrarakro/contents/uploads/";
    const GITHUB_RAW_URL = "https://raw.githubusercontent.com/ARISALAB/qrarakro/main/uploads/";
    const GITHUB_TOKEN = "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";

    let profilePictureURL = "";
    let backCoverURL = "";

    // Διαχείριση επιλογής εικόνας προφίλ
    document.getElementById('profilePicture').addEventListener('change', async function (event) {
        const file = event.target.files[0];
        if (file) {
            profilePictureURL = await uploadToGitHub(file);
        }
    });

    // Διαχείριση επιλογής back cover
    document.getElementById('backCover').addEventListener('change', async function (event) {
        const file = event.target.files[0];
        if (file) {
            backCoverURL = await uploadToGitHub(file);
        }
    });

    // Συνάρτηση για ανέβασμα αρχείου στο GitHub
    async function uploadToGitHub(file) {
        const fileContent = await readFileAsArrayBuffer(file);
        const fileBase64 = arrayBufferToBase64(fileContent);

        const response = await fetch(GITHUB_API_URL + file.name, {
            method: "PUT",
            headers: {
                "Authorization": `token ${GITHUB_TOKEN}`,
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                message: "Ανέβασμα αρχείου μέσω εφαρμογής",
                content: fileBase64,
                branch: "main"
            }),
        });

        if (response.ok) {
            const rawURL = `${GITHUB_RAW_URL}${file.name}`;
            alert(`Η εικόνα ${file.name} ανέβηκε με επιτυχία: ${rawURL}`);
            return rawURL;
        } else {
            alert(`Αποτυχία ανεβάσματος της εικόνας ${file.name}`);
            return "";
        }
    }

    // Δημιουργία VCard URL και QR Code
    function generateVCardURL() {
        const companyName = document.getElementById('companyName').value;
        const email = document.getElementById('email').value;
        const address = document.getElementById('address').value;
        const phone = document.getElementById('phone').value;
        const website = document.getElementById('website').value;

        if (!companyName || !email || !address || !phone || !website) {
            alert('Παρακαλώ συμπληρώστε όλα τα πεδία.');
            return;
        }

        const vCardData = {
            companyName,
            email,
            address,
            phone,
            website,
            profilePictureURL,
            backCoverURL,
        };

        const vCardURL = `${window.location.origin}${window.location.pathname}?data=${encodeURIComponent(JSON.stringify(vCardData))}`;

        // Εμφάνιση προεπισκόπησης
        const preview = document.getElementById('preview');
        preview.style.display = 'block';
        preview.innerHTML = `
            <div class="vcard-container">
                <div class="vcard-backcover" style="background-image: url('${backCoverURL}')"></div>
                <div class="vcard-profile-picture" style="background-image: url('${profilePictureURL}')"></div>
                <div class="vcard-content">
                    <h2>${companyName}</h2>
                    <p><strong>Email:</strong> ${email}</p>
                    <p><strong>Address:</strong> ${address}</p>
                    <p><strong>Phone:</strong> ${phone}</p>
                    <p><strong>Website:</strong> <a href="${website}" target="_blank">${website}</a></p>
                </div>
            </div>
            <p><a href="${vCardURL}" target="_blank">Shareable V-Card Link</a></p>
        `;

        // Δημιουργία QR Code
        generateQRCode(vCardURL);
    }

    // Συνάρτηση δημιουργίας QR Code
    function generateQRCode(vCardURL) {
        const qrcodeDiv = document.getElementById('qrcode');
        qrcodeDiv.style.display = 'block';
        qrcodeDiv.innerHTML = '<h2>QR Code</h2>';

        QRCode.toCanvas(vCardURL, { errorCorrectionLevel: 'H' }, function (error, canvas) {
            if (error) {
                console.error(error);
                alert('Αποτυχία δημιουργίας QR Code. Τα δεδομένα μπορεί να είναι πολύ μεγάλα.');
                qrcodeDiv.innerHTML += '<p style="color: red;">QR Code generation failed. Try reducing the amount of data.</p>';
                return;
            }
            qrcodeDiv.appendChild(canvas);
        });
    }

    // Διαβάζει αρχείο ως ArrayBuffer
    function readFileAsArrayBuffer(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    }

    // Μετατροπή ArrayBuffer σε Base64
    function arrayBufferToBase64(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = '';
        for (let i = 0; i < bytes.byteLength; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
    }

    // Ανάκτηση δεδομένων από URL
    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        const data = params.get("data");
        if (data) {
            const vCardData = JSON.parse(decodeURIComponent(data));
            const { companyName, email, address, phone, website, profilePictureURL, backCoverURL } = vCardData;

            const preview = document.getElementById('preview');
            preview.style.display = 'block';
            preview.innerHTML = `
                <div class="vcard-container">
                    <div class="vcard-backcover" style="background-image: url('${backCoverURL}')"></div>
                    <div class="vcard-profile-picture" style="background-image: url('${profilePictureURL}')"></div>
                    <div class="vcard-content">
                        <h2>${companyName}</h2>
                        <p><strong>Email:</strong> ${email}</p>
                        <p><strong>Address:</strong> ${address}</p>
                        <p><strong>Phone:</strong> ${phone}</p>
                        <p><strong>Website:</strong> <a href="${website}" target="_blank">${website}</a></p>
                    </div>
                </div>
            `;
        }
    };
</script>

</body>
</html>
