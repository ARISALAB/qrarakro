<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AR Akron QR Generator</title>
    <script src="https://www.paypal.com/sdk/js?client-id=AbP8aGEBpUSbe7x2frrXYzb502UdR7uL3CjpNb-Sp6lk7hy0j9sYRAJORgfzT01owV39NlnKlycB1mcj"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>

    
    </style>
</head>
<body>
    <header>
        <h1>My AR Akron QR Generator</h1>
    </header>

    <div id="home" class="container">
        <h2>Create Your QR Code</h2>
        
        <div class="section">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" class="small-input">
        </div>

        <div class="section">
            <label for="url">URL:</label>
            <input type="text" id="url" name="url" class="small-input">
        </div>

        <div class="section">
            <label for="customText">Custom Text:</label>
            <input type="text" id="customText" name="customText" class="small-input">
        </div>

        <div id="paypal-button-container" style="margin-top: 20px;"></div>
        <canvas id="qrCode" width="300" height="300" style="display:none; margin-top: 20px;"></canvas>
        <a id="downloadLink" href="#" class="download-button" style="display:none;">Download QR Code</a>
    </div>

    <script>
        function generateQR() {
            const name = document.getElementById("name").value;
            const url = document.getElementById("url").value;
            const customText = document.getElementById("customText").value;

            if (!url) {
                alert("Please provide a valid URL.");
                return null;
            }

            const qrCanvas = document.getElementById("qrCode");
            const qr = new QRious({
                element: qrCanvas,
                value: url,
                size: 300,
                foreground: "#000000"
            });

            // Add custom text below the QR Code
            const context = qrCanvas.getContext("2d");
            context.font = "16px Arial";
            context.textAlign = "center";
            context.fillStyle = "black";
            context.fillText(customText, qrCanvas.width / 2, qrCanvas.height - 10);

            const downloadLink = document.getElementById("downloadLink");
            downloadLink.style.display = "inline-block";
            downloadLink.href = qrCanvas.toDataURL("image/jpeg").replace("image/jpeg", "image/octet-stream");
            downloadLink.download = "qr-code.jpg";

            qrCanvas.style.display = "block";
        }

        // PayPal Button Integration
        paypal.Buttons({
            createOrder: function(data, actions) {
                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            value: '5.00' // Amount for payment
                        }
                    }]
                });
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    alert('Payment completed by ' + details.payer.name.given_name);
                    generateQR(); // Generate and display the QR Code after successful payment
                });
            },
            onError: function(err) {
                console.error("PayPal error:", err);
                alert("An error occurred during payment. Please try again.");
            }
        }).render('#paypal-button-container');
    </script>
</body>
</html>
