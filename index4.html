<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ανέβασμα Αρχείων</title>
    <link rel="stylesheet" href="styles.css">
</head>
    <style>
       /* styles.css */
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

h1 {
    color: #333;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 10px;
    font-weight: bold;
}

input[type="file"] {
    margin-bottom: 20px;
}

button {
    background-color: #007BFF;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 4px;
}

button:hover {
    background-color: #0056b3;
}

#output {
    margin-top: 20px;
    color: #28a745;
    font-weight: bold;
}
 
    </style>
<body>
    <div class="container">
        <h1>Ανέβασμα Αρχείων</h1>
        <form id="uploadForm">
            <label for="fileUpload">Επιλέξτε το αρχείο σας:</label>
            <input type="file" id="fileUpload" accept=".pdf,.doc,.docx" required>
            <button type="submit">Ανέβασμα</button>
        </form>
        <div id="output"></div>
    </div>
    <script src="script.js"></script>
    <script>
        // script.js
document.getElementById('uploadForm').addEventListener('submit', function (e) {
    e.preventDefault();
    
    const fileInput = document.getElementById('fileUpload');
    const file = fileInput.files[0];

    if (!file) {
        alert('Παρακαλώ επιλέξτε ένα αρχείο.');
        return;
    }

    const allowedExtensions = ['pdf', 'doc', 'docx'];
    const fileExtension = file.name.split('.').pop().toLowerCase();

    if (!allowedExtensions.includes(fileExtension)) {
        alert('Μόνο αρχεία PDF και DOC επιτρέπονται.');
        return;
    }

    // Εδώ μπορείτε να στείλετε το αρχείο στον server μέσω AJAX, αν χρειάζεται.
    document.getElementById('output').textContent = `Το αρχείο "${file.name}" φορτώθηκε επιτυχώς!`;
});

    </script>
</body>
</html>
