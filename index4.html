<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Files to GitHub</title>
</head>
<body>
    <h1>Upload Files to GitHub</h1>
    <form id="uploadForm">
        <input type="file" id="fileInput" name="file" />
        <button type="submit">Upload</button>
    </form>

    <div id="status"></div>

    <script>
        // GitHub API URL και το προσωπικό GitHub token
        const GITHUB_API_URL = "https://api.github.com/repos/ARISALAB/qrarakro/contents/";
        const GITHUB_TOKEN = "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";  // Αντικατέστησε με το προσωπικό σου GitHub token

        // Σύνδεση φόρμας με το JavaScript
        document.getElementById("uploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];

            if (!file) {
                alert("Παρακαλώ επιλέξτε ένα αρχείο.");
                return;
            }

            // Διαβάζει το περιεχόμενο του αρχείου και το μετατρέπει σε Base64
            const fileContent = await readFile(file);
            const fileBase64 = btoa(fileContent);  // Μετατροπή του περιεχομένου του αρχείου σε Base64

            const path = file.name;  // Το όνομα του αρχείου στο GitHub repository
            const message = "Ανέβασμα αρχείου μέσω εφαρμογής";

            // Αίτηση προς το GitHub API για να ανεβάσουμε το αρχείο
            const response = await fetch(GITHUB_API_URL + path, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: message,
                    content: fileBase64,
                    branch: 'main'  // Ο κλάδος του repository
                })
            });

            const result = await response.json();

            if (response.ok) {
                document.getElementById("status").textContent = `Αρχείο ανέβηκε με επιτυχία: ${result.content.html_url}`;
            } else {
                document.getElementById("status").textContent = `Σφάλμα: ${result.message}`;
            }
        });

        // Διαβάζει το περιεχόμενο του αρχείου
        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }
    </script>
</body>
</html>
