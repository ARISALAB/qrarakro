<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Files to GitHub with QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
   
</head>
<body>
    <h1>Upload Files to GitHub</h1>
    <form id="uploadForm">
        <input type="file" id="fileInput" name="file" />
        <button type="submit">Upload</button>
    </form>

    <div id="status"></div>
    <div id="qrcode"></div> <!-- QR Code θα εμφανίζεται εδώ -->
    <div id="fileLink"></div> <!-- Θα εμφανιστεί το link για το raw αρχείο -->

    <script>
        // GitHub API URL και το προσωπικό GitHub token
        const GITHUB_API_URL = "https://api.github.com/repos/ARISALAB/qrarakro/contents/uploads/"; // Δημιουργία φακέλου "uploads"
        const GITHUB_TOKEN = "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";  // Αντικατέστησε με το προσωπικό σου GitHub token

        // Σύνδεση φόρμας με το JavaScript
        document.getElementById("uploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];

            if (!file) {
                alert("Παρακαλώ επιλέξτε ένα αρχείο.");
                return;
            }

            // Διαβάζει το περιεχόμενο του αρχείου ως ArrayBuffer
            const fileContent = await readFileAsArrayBuffer(file);
            const fileBase64 = arrayBufferToBase64(fileContent);  // Μετατροπή του περιεχομένου σε Base64

            const path = "uploads/" + file.name;  // Αποθήκευση στον φάκελο "uploads"
            const message = "Ανέβασμα αρχείου μέσω εφαρμογής";

            // Αίτηση προς το GitHub API για να ανεβάσουμε το αρχείο
            const response = await fetch(GITHUB_API_URL + file.name, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: message,
                    content: fileBase64,
                    branch: 'main'  // Ο κλάδος του repository
                })
            });

            const result = await response.json();

            if (response.ok) {
                // Εμφάνιση μηνύματος επιτυχίας
                document.getElementById("status").textContent = `Αρχείο ανέβηκε με επιτυχία: ${result.content.html_url}`;
                
                // Δημιουργία QR Code
                generateQRCode(result.content.download_url); // Δημιουργεί QR Code με το URL του αρχείου

                // Εμφάνιση του raw URL για πλήρη προβολή του αρχείου
                const rawUrl = result.content.download_url;  // Αυτό το URL θα δείχνει το raw περιεχόμενο του αρχείου
                document.getElementById("fileLink").innerHTML = `<p>Μπορείτε να δείτε το αρχείο σε πλήρη οθόνη <a href="${rawUrl}" target="_blank">εδώ</a>.</p>`;
            } else {
                document.getElementById("status").textContent = `Σφάλμα: ${result.message}`;
            }
        });

        // Διαβάζει το αρχείο ως ArrayBuffer (για δυαδικά δεδομένα και UTF-8)
        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);  // Χρησιμοποιούμε readAsArrayBuffer για δυαδικά δεδομένα
            });
        }

        // Μετατρέπει το ArrayBuffer σε Base64
        function arrayBufferToBase64(buffer) {
            let binary = '';
            let bytes = new Uint8Array(buffer);
            let length = bytes.byteLength;
            for (let i = 0; i < length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);  // Χρησιμοποιούμε btoa για να μετατρέψουμε σε Base64
        }

        // Δημιουργία QR Code με το URL
        function generateQRCode(url) {
            const qrcodeContainer = document.getElementById("qrcode");
            // Καθαρίζει τυχόν προηγούμενα QR codes
            qrcodeContainer.innerHTML = '';
            // Δημιουργεί το νέο QR Code
            new QRCode(qrcodeContainer, {
                text: url,  // Το URL που θα χρησιμοποιηθεί για τον QR Code
                width: 128,
                height: 128,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.L
            });
        }
    </script>
</body>
</html>
