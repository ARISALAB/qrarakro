<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Files to GitHub with QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #E3F2FD;
            color: #0D47A1;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: #0D47A1;
            margin-top: 50px;
        }

        form {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        input[type="file"] {
            padding: 10px;
            margin-right: 10px;
            border: 2px solid #0D47A1;
            border-radius: 5px;
            background-color: #FFEB3B;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background-color: #FFEB3B;
            color: #0D47A1;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #FFD600;
        }

        #status {
            text-align: center;
            margin-top: 30px;
            font-size: 18px;
            color: #388E3C;
        }

        #status.error {
            color: #D32F2F;
        }

        #qrcodeContainer {
            text-align: center;
            margin-top: 30px;
            position: relative;
        }

        #qrcode {
            margin: auto;
        }

        #fileLink {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: #0D47A1;
        }

        #fileLink a {
            color: #FFEB3B;
            text-decoration: none;
        }

        #fileLink a:hover {
            color: #FFD600;
        }

        .download-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #FFEB3B;
            color: #0D47A1;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .download-btn:hover {
            background-color: #FFD600;
        }
    </style>
</head>
<body>
    <h1>Upload Files to GitHub</h1>
    <form id="uploadForm">
        <input type="file" id="fileInput" name="file" />
        <button type="submit">Upload</button>
    </form>

    <div id="status"></div>
    <div id="qrcodeContainer">
        <canvas id="qrcodeCanvas"></canvas> <!-- QR Code μέσα σε canvas -->
    </div>
    <div id="fileLink"></div>

    <script>
        const GITHUB_API_URL = "https://api.github.com/repos/ARISALAB/qrarakro/contents/uploads/";
        const GITHUB_TOKEN = "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";

        document.getElementById("uploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];

            if (!file) {
                alert("Παρακαλώ επιλέξτε ένα αρχείο.");
                return;
            }

            const fileContent = await readFileAsArrayBuffer(file);
            const fileBase64 = arrayBufferToBase64(fileContent);

            const path = "uploads/" + file.name;
            const message = "Ανέβασμα αρχείου μέσω εφαρμογής";

            const response = await fetch(GITHUB_API_URL + file.name, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: message,
                    content: fileBase64,
                    branch: 'main'
                })
            });

            const result = await response.json();

            if (response.ok) {
                document.getElementById("status").textContent = `Αρχείο ανέβηκε με επιτυχία: ${result.content.html_url}`;
                document.getElementById("status").classList.remove("error");

                generateQRCode(result.content.download_url);

                const rawUrl = result.content.download_url;
                document.getElementById("fileLink").innerHTML = `<p>Μπορείτε να δείτε το αρχείο σε πλήρη οθόνη <a href="${rawUrl}" target="_blank">εδώ</a>.</p>`;
            } else {
                document.getElementById("status").textContent = `Σφάλμα: ${result.message}`;
                document.getElementById("status").classList.add("error");
            }
        });

        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        function arrayBufferToBase64(buffer) {
            let binary = '';
            let bytes = new Uint8Array(buffer);
            let length = bytes.byteLength;
            for (let i = 0; i < length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        function generateQRCode(url) {
            const qrcodeContainer = document.getElementById("qrcodeContainer");
            const canvas = document.getElementById("qrcodeCanvas");

            // Καθαρίζει τυχόν προηγούμενο QR code
            qrcodeContainer.innerHTML = '';
            
            // Δημιουργία του QR code
            const qr = new QRCode(canvas, {
                text: url,
                width: 200,
                height: 200,
                colorDark : "#0D47A1",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.L
            });

            // Παρέχουμε τη δυνατότητα κατεβάσματος του QR code
            const downloadButton = document.createElement('button');
            downloadButton.classList.add('download-btn');
            downloadButton.textContent = 'Κατέβασε το QR Code';
            downloadButton.addEventListener('click', () => {
                const qrImage = canvas.toDataURL('image/png');  // Μετατρέπει το canvas σε εικόνα
                const link = document.createElement('a');
                link.href = qrImage;
                link.download = 'qrcode.png';
                link.click();
            });
            qrcodeContainer.appendChild(downloadButton);
        }
    </script>
</body>
</html>
